spring.application.name=mahila-backend
server.port=8080

# Database Configuration
spring.datasource.url=${MAHILA_DB_URL:jdbc:mysql://localhost:3306/mahila_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${MAHILA_DB_USERNAME:root}
spring.datasource.password=${MAHILA_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Security / JWT Configuration
mahila.jwt.secret=${MAHILA_JWT_SECRET:change-me-in-production}
mahila.jwt.expiration-ms=${MAHILA_JWT_EXPIRATION_MS:86400000}

# Gemini AI Configuration
mahila.ai.gemini.api-key=${GEMINI_API_KEY:}
mahila.ai.gemini.model=${MAHILA_GEMINI_MODEL:gemini-2.0-flash}
